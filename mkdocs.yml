
site_name: Python Static | API Documentation
site_description: Документація Django-проєкту
site_url: https://sunmeat.github.io/python_static/
repo_url: https://github.com/sunmeat/python_static
repo_name: sunmeat/python_static

theme:
  name: material
  language: uk
  features:
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.highlight

nav:
  - Головна: index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_submodules: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
